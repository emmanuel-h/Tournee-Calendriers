name: tournee_calendriers
description: "Tournée des calendriers des sapeurs-pompiers."
# Private app: never published to pub.dev.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5
  # Flutter 3.47.6 is the version the project was scaffolded and tested with.
  flutter: 3.47.6

# Versions are pinned exactly (no `^`) so every machine and CI resolve the same
# packages; upgrades are deliberate, one commit each.
dependencies:
  # Firebase (PLAN §10.2), only in infrastructure/ and bootstrap/: the
  # Firestore database (the tournées and their streets, with its offline
  # cache), App Check (only the genuine app talks to Firebase), anonymous
  # sign-in (the uid is the member id) and the core every Firebase plugin
  # needs.
  cloud_firestore: 6.10.0
  firebase_app_check: 0.4.8
  firebase_auth: 6.7.0
  firebase_core: 4.15.0
  flutter:
    sdk: flutter
  # Material and Cupertino translations for French (dates, tooltips, the
  # licences page).
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.4.3
  go_router: 18.0.2
  # Address and map services over HTTP (BAN, geopf, Overpass), only in
  # infrastructure/ (PLAN §10.2).
  http: 1.6.0
  # Required by the code gen-l10n writes into lib/ui/l10n/; the version is the
  # one flutter_localizations pins.
  intl: 0.20.3
  # Where the phone keeps the streets until Firestore replaces that storage
  # (M1, T1.6); only in infrastructure/ and bootstrap/.
  path_provider: 2.1.6
  # Draws the join code as a QR code in Équipe (PLAN §5.2, §5.8, §10.2).
  qr_flutter: 4.1.0
  # The phone's share sheet for « Partager » the join code (PLAN §10.2);
  # only in ui/.
  share_plus: 13.3.1

dev_dependencies:
  # An in-memory Firestore for the adapters' tests (PLAN §11): no emulator,
  # no network.
  fake_cloud_firestore: 4.3.0
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter
  # Instrumented suite run on an emulator or phone (integration_test/).
  integration_test:
    sdk: flutter
  # The companion of fake_cloud_firestore that makes one of its calls throw
  # (`whenCalling(…).on(document).thenThrow(…)`): how the adapters' tests
  # play a phone without network.
  mock_exceptions: 0.8.2
  # Plain Dart test runner, used by the architecture test and pure-Dart suites.
  test: 1.31.1

flutter:
  uses-material-design: true
  # Generates `AppLocalizations` from lib/ui/l10n/app_fr.arb (see l10n.yaml) on
  # every `flutter pub get`, `flutter run` and `flutter test`.
  generate: true

  # Licence texts shown on the licences page (registered in bootstrap/).
  assets:
    - assets/fonts/atkinson_hyperlegible/OFL.txt
    - assets/fonts/barlow_condensed/OFL.txt

  # Bundled so the app looks the same offline (PLAN §10.2). Only the weights the
  # mockups use are shipped.
  fonts:
    - family: Atkinson Hyperlegible
      fonts:
        - asset: assets/fonts/atkinson_hyperlegible/AtkinsonHyperlegible-Regular.ttf
          weight: 400
        - asset: assets/fonts/atkinson_hyperlegible/AtkinsonHyperlegible-Bold.ttf
          weight: 700
    - family: Barlow Condensed
      fonts:
        - asset: assets/fonts/barlow_condensed/BarlowCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/barlow_condensed/BarlowCondensed-Bold.ttf
          weight: 700
