<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Fiche maison — quand repasser</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;family=Barlow+Condensed:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B3261E}a:hover{color:#8C1D18}
.ghost{height:60px;border-radius:12px;background:#FFFFFF;border:1.5px solid #CFC9BD;box-sizing:border-box}
.seg{flex:1;height:64px;border:0;font:700 15px 'Atkinson Hyperlegible',sans-serif;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.sep{width:1.5px;background:#CFC9BD}
.lbl{font-size:15px;font-weight:700}
.in{height:52px;box-sizing:border-box;width:100%;border:1.5px solid #CFC9BD;border-radius:12px;background:#FFFFFF;padding:0 14px;font:400 17px 'Atkinson Hyperlegible',sans-serif;color:#1B1F24}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F1EC; color: #1B1F24; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; position: relative; overflow: hidden">
  <div style="padding: 120px 16px 0 16px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 12px">
    <div class="ghost"></div><div class="ghost" style="background: #1E6B47; border-color: #1E6B47"></div>
    <div class="ghost" style="background: #1E6B47; border-color: #1E6B47"></div><div class="ghost" style="background: #1E6B47; border-color: #1E6B47"></div>
    <div class="ghost" style="background: #F2B33D; border-color: #D99A22"></div><div class="ghost"></div>
  </div>
  <div style="position: absolute; inset: 0; background: rgba(27, 31, 36, 0.5)"></div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-radius: 24px 24px 0 0; padding: 12px 20px 28px 20px; display: flex; flex-direction: column; gap: 18px">
    <div style="width: 40px; height: 4px; border-radius: 2px; background: #CFC9BD; align-self: center"></div>
    <div style="display: flex; align-items: baseline; gap: 10px">
      <h2 style="margin: 0; font: 700 34px 'Barlow Condensed', sans-serif">5</h2>
      <span style="font: 600 22px 'Barlow Condensed', sans-serif; color: #4A5058">Rue des Lilas</span>
    </div>
    <div role="radiogroup" aria-label="Statut" style="display: flex; border: 1.5px solid #CFC9BD; border-radius: 14px; overflow: hidden">
      <button class="seg" role="radio" aria-checked="false" style="background: #FFFFFF; color: #1B1F24"><span>○</span>À faire</button>
      <span class="sep"></span>
      <button class="seg" role="radio" aria-checked="false" style="background: #FFFFFF; color: #1B1F24"><span>✓</span>Fait</button>
      <span class="sep"></span>
      <button class="seg" role="radio" aria-checked="false" style="background: #FFFFFF; color: #1B1F24"><span>✗</span>Personne</button>
      <span class="sep"></span>
      <button class="seg" role="radio" aria-checked="true" style="background: #1B1F24; color: #FFFFFF"><span>↻</span>Repasser</button>
    </div>
    <!-- #81: opened by itself when a tap brings the house (or a door) to ↻. « Quand repasser ? » is a
         day (chips: today, tomorrow, then the next days, scrolling sideways) and an optional hour
         (8 h–21 h or « Pas d'heure »). Stored at once, like every control of the sheet. -->
    <div style="display: flex; flex-direction: column; gap: 10px; background: #D6E6F5; border-radius: 14px; padding: 14px">
      <span class="lbl">Quand repasser ?</span>
      <div role="radiogroup" aria-label="Jour" style="display: flex; gap: 8px; overflow-x: auto"><button role="radio" aria-checked="false" style="height: 40px; padding: 0 12px; border-radius: 20px; border: 1.5px solid #A9C8E6; background: #FFFFFF; color: #1D4E7A; font: 700 14px 'Atkinson Hyperlegible', sans-serif; white-space: nowrap">Aujourd'hui</button><button role="radio" aria-checked="false" style="height: 40px; padding: 0 12px; border-radius: 20px; border: 1.5px solid #A9C8E6; background: #FFFFFF; color: #1D4E7A; font: 700 14px 'Atkinson Hyperlegible', sans-serif; white-space: nowrap">Demain</button><button role="radio" aria-checked="true" style="height: 40px; padding: 0 12px; border-radius: 20px; border: 1.5px solid #1D4E7A; background: #1D4E7A; color: #FFFFFF; font: 700 14px 'Atkinson Hyperlegible', sans-serif; white-space: nowrap">Sam. 24</button><button role="radio" aria-checked="false" style="height: 40px; padding: 0 12px; border-radius: 20px; border: 1.5px solid #A9C8E6; background: #FFFFFF; color: #1D4E7A; font: 700 14px 'Atkinson Hyperlegible', sans-serif; white-space: nowrap">Dim. 25</button><button role="radio" aria-checked="false" style="height: 40px; padding: 0 12px; border-radius: 20px; border: 1.5px solid #A9C8E6; background: #FFFFFF; color: #1D4E7A; font: 700 14px 'Atkinson Hyperlegible', sans-serif; white-space: nowrap">Lun. 26</button></div>
      <div style="display: flex; align-items: center; gap: 12px"><label class="lbl" for="hour">Heure</label>
        <select class="in" id="hour" style="flex: 1; border-color: #A9C8E6"><option>Pas d'heure</option><option selected>18 h</option></select></div>
      <span style="font-size: 15px; color: #1D4E7A; font-weight: 700">Le samedi 24 oct. vers 18 h</span>
    </div>
    <!-- Only on a sheet opened by a tap: « Annuler » puts back the status before the tap and closes;
         « OK » closes. The tap's undo snackbar is not shown. -->
    <div style="display: flex; gap: 12px">
      <button style="flex: 1; height: 52px; border-radius: 26px; border: 1.5px solid #CFC9BD; background: #FFFFFF; font: 700 16px 'Atkinson Hyperlegible', sans-serif; color: #1B1F24">Annuler</button>
      <button style="flex: 1; height: 52px; border-radius: 26px; border: 0; background: #B3261E; font: 700 16px 'Atkinson Hyperlegible', sans-serif; color: #FFFFFF">OK</button>
    </div>
    <!-- No free note (removed for privacy, PLAN §8.3, Q23): the hint above is the only text. -->
    <span style="font-size: 14px; color: #5A6068; text-align: center">Modifié par vous · 14:02</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
