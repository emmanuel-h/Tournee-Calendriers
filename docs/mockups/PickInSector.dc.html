<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Ajouter des rues — rue du secteur</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&amp;family=Barlow+Condensed:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B3261E}a:hover{color:#8C1D18}
.ib{width:48px;height:48px;border:0;background:transparent;color:#1B1F24;border-radius:24px;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;text-decoration:none;flex-shrink:0}
.ib svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pill{height:48px;border-radius:24px;border:1.5px solid #CFC9BD;background:#FFFFFF;display:flex;align-items:center;gap:8px;font:700 15px 'Atkinson Hyperlegible',sans-serif;color:#1B1F24;text-decoration:none;box-sizing:border-box}
.sel{display:flex;align-items:center;gap:10px;min-height:52px;border-bottom:1px solid #E2DED5}
.tab{flex:1;height:40px;border:0;font:700 14px 'Atkinson Hyperlegible',sans-serif;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F1EC; color: #1B1F24; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden">
  <div style="display: flex; align-items: center; gap: 4px; padding: 8px 8px 4px 8px">
    <a class="ib" href="RunTeam.dc.html" aria-label="Fermer"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
    <h1 style="flex: 1; margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 28px">Ajouter des rues</h1>
  </div>
  <div role="tablist" style="margin: 0 16px 10px 16px; display: flex; border: 1.5px solid #CFC9BD; border-radius: 24px; overflow: hidden; height: 48px">
    <button role="tab" aria-selected="true" style="flex: 1; border: 0; background: #1B1F24; color: #FFFFFF; font: 700 16px 'Atkinson Hyperlegible', sans-serif">Carte</button>
    <a role="tab" aria-selected="false" href="AddList.dc.html" style="flex: 1; background: #FFFFFF; color: #1B1F24; font-weight: 700; font-size: 16px; display: flex; align-items: center; justify-content: center; text-decoration: none">Liste</a>
  </div>
  <div style="padding: 0 16px 10px 16px; display: flex; gap: 8px">
    <div style="position: relative; flex: 1">
      <svg viewBox="0 0 24 24" style="position: absolute; left: 14px; top: 14px; width: 20px; height: 20px; fill: none; stroke: #4A5058; stroke-width: 2; stroke-linecap: round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input aria-label="Rechercher une rue" placeholder="Rechercher une rue" style="height: 48px; box-sizing: border-box; width: 100%; border: 1.5px solid #CFC9BD; border-radius: 24px; background: #FFFFFF; padding: 0 14px 0 44px; font: 400 16px 'Atkinson Hyperlegible', sans-serif; color: #1B1F24">
    </div>
    <!-- « Zone »: drag a rectangle; every street inside is ticked (PickZone.dc.html). -->
    <a class="pill" href="PickZone.dc.html" aria-label="Sélectionner une zone" style="padding: 0 16px"><svg viewBox="0 0 24 24" aria-hidden="true" style="width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-dasharray: 3 2.5"><rect x="4" y="5" width="16" height="14" rx="1"/></svg>Zone</a>
  </div>
  <div style="position: relative; flex: 1">
    <svg viewBox="0 110 390 460" style="position: absolute; inset: 0; width: 390px; height: 460px" role="img" aria-label="Carte : rue Pasteur touchée, rue Pierre Morin et impasse des Tilleuls toujours cochées">
      <rect width="390" height="460" fill="#F2EFE9"/>
      <rect x="0" y="0" width="80" height="98" fill="#E4DFD5"/><rect x="100" y="0" width="140" height="98" fill="#E4DFD5"/><rect x="262" y="0" width="128" height="98" fill="#E4DFD5"/>
      <rect x="0" y="124" width="80" height="104" fill="#E4DFD5"/><rect x="100" y="124" width="140" height="104" fill="#DCE8CF"/><rect x="262" y="124" width="128" height="104" fill="#E4DFD5"/>
      <rect x="0" y="254" width="240" height="94" fill="#E4DFD5"/><rect x="262" y="254" width="128" height="94" fill="#E4DFD5"/>
      <rect x="0" y="374" width="240" height="86" fill="#E4DFD5"/><rect x="262" y="374" width="128" height="86" fill="#E4DFD5"/>
      <g stroke="#FFFFFF" stroke-width="14" fill="none" stroke-linecap="round">
        <path d="M0 111H390"/><path d="M0 241H390"/><path d="M0 361H390"/><path d="M320 241V460"/><path d="M90 0V460"/><path d="M251 0V460"/>
      </g>
      <g fill="none" stroke-linecap="round">
        <path d="M0 111H390" stroke="#E0A21B" stroke-width="7"/>
        <path d="M90 111V241" stroke="#2F5DA8" stroke-width="7"/>
        <path d="M0 241H390" stroke="#1E6B47" stroke-width="7"/>
        <path d="M251 0V460" stroke="#2F5DA8" stroke-width="7"/>
      </g>
      <path d="M0 241H390" stroke="#1B1F24" stroke-width="16" stroke-linecap="round"/>
      <path d="M0 241H390" stroke="#1E6B47" stroke-width="6" stroke-linecap="round"/>
      <g><circle cx="190" cy="241" r="12" fill="#1B1F24" fill-opacity="0.18"/><circle cx="190" cy="241" r="5" fill="#FFFFFF" stroke="#1B1F24" stroke-width="2"/></g>
      <path d="M0 361H251" stroke="#1B1F24" stroke-width="16" stroke-linecap="round"/>
      <path d="M0 361H251" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
      <path d="M320 241V460" stroke="#1B1F24" stroke-width="16" stroke-linecap="round"/>
      <path d="M320 241V460" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
      <g><circle cx="160" cy="361" r="14" fill="#1B1F24"/><path d="M153 361l5 5 9-10" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
      <g><circle cx="320" cy="300" r="14" fill="#1B1F24"/><path d="M313 300l5 5 9-10" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
      <g font-family="Atkinson Hyperlegible, sans-serif" font-size="12" font-weight="700" fill="#1B1F24">
        <text x="110" y="100">Rue des Lilas</text><text x="110" y="230">Rue Pasteur</text><text x="110" y="390">Rue Pierre Morin</text><text x="314" y="430" transform="rotate(-90 314 430)">Impasse des Tilleuls</text>
      </g>
    </svg>
  </div>
  <!-- A tap on a street already in the secteur (its line or its dot) shows its card in place of
       the selection sheet, at once and offline, from the phone's copy; its road takes the dark
       casing over its own colour and the point tapped gets the dark dot. The ticks stay on the map
       and in the selection, untouched. ✕ (« Fermer ») or the back gesture brings the selection
       sheet back; a tap on another road closes the card and goes on as before (tick / untick, or
       another secteur street's card).
       « Modifier la rue » opens edit mode (Edit.dc.html) on that street; « OK », ✕ or back
       come back here, the card closed, the map redrawn (name, part).
       « Supprimer la rue » asks first, as edit mode does: « Supprimer la rue ? — « Rue Pasteur »
       part à la Corbeille avec ses numéros et leurs statuts pour toute l'équipe. [Annuler]
       [Supprimer] ». Then the card closes, the snackbar says « Rue Pasteur supprimée » and the
       road shows as a road not in the secteur, so it can be ticked again (it comes back from the
       Corbeille with its marks, 5.4). -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-radius: 24px 24px 0 0; box-shadow: 0 -4px 20px rgba(27, 31, 36, 0.14); padding: 10px 20px 24px 20px; display: flex; flex-direction: column; gap: 12px">
    <div style="width: 40px; height: 4px; border-radius: 2px; background: #CFC9BD; align-self: center"></div>
    <div style="display: flex; align-items: flex-start; gap: 8px">
      <div style="flex: 1; display: flex; flex-direction: column">
        <h2 style="margin: 0; font: 700 28px 'Barlow Condensed', sans-serif">Rue Pasteur</h2>
        <span style="font-size: 15px; color: #4A5058">Villefranche-sur-Saône</span>
      </div>
      <a class="ib" href="Pick.dc.html" aria-label="Fermer" style="margin: -6px -10px 0 0"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
    </div>
    <div style="display: flex; flex-wrap: wrap; gap: 8px">
      <span style="padding: 6px 12px; border-radius: 16px; background: #F3F1EC; font-size: 14px; font-weight: 700">Dans le secteur</span>
      <span style="padding: 6px 12px; border-radius: 16px; background: #F3F1EC; font-size: 14px; font-weight: 700">18/18 faits</span>
      <span style="padding: 6px 12px; border-radius: 16px; background: #F3F1EC; font-size: 14px; font-weight: 700">Toute la rue</span>
    </div>
    <a href="Edit.dc.html" style="height: 52px; border-radius: 26px; background: #B3261E; color: #FFFFFF; font-weight: 700; font-size: 16px; display: flex; align-items: center; justify-content: center; text-decoration: none">Modifier la rue</a>
    <button style="height: 52px; border-radius: 26px; border: 1.5px solid #B3261E; background: #FFFFFF; font: 700 16px 'Atkinson Hyperlegible', sans-serif; color: #B3261E">Supprimer la rue</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
