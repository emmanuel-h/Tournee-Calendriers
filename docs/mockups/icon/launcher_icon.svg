  <!--
    Launcher icon (#101), approved 2026-11-02: a chrome F1 helmet (three-quarter view, facing
    left, gold plate, gold visor, clear chin shield) on a street map in the app's colours,
    with the « faite » ✓ badge.
    108 x 108 adaptive canvas: launchers show the centre 72 x 72 (18..90) cut by their mask;
    everything that matters sits inside the 66 dp safe circle.
    id="background" -> ic_launcher_background, id="foreground" -> ic_launcher_foreground.
  -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7F5F0"/><stop offset="1" stop-color="#E9E4D8"/></linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="0.55" stop-color="#E6E9ED"/><stop offset="1" stop-color="#B4BCC6"/></linearGradient>
    <linearGradient id="visorc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF1C4"/><stop offset="1" stop-color="#E9B23A"/></linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4A515B"/><stop offset="1" stop-color="#1B1F24"/></linearGradient>
    <radialGradient id="shadow"><stop offset="0" stop-color="#1B1F24" stop-opacity="0.30"/><stop offset="1" stop-color="#1B1F24" stop-opacity="0"/></radialGradient>
  </defs>
  <g id="background">
  <rect width="108" height="108" fill="url(#ground)"/>
