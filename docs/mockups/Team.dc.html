<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const N = 21;
    const finder = (r, c) => {
      const boxes = [[0, 0], [0, N - 7], [N - 7, 0]];
      for (const [r0, c0] of boxes) {
        if (r >= r0 && r < r0 + 7 && c >= c0 && c < c0 + 7) {
          const rr = r - r0, cc = c - c0;
          const ring = rr === 0 || rr === 6 || cc === 0 || cc === 6;
          const core = rr >= 2 && rr <= 4 && cc >= 2 && cc <= 4;
          return ring || core ? 1 : 0;
        }
        if (r >= r0 - 1 && r <= r0 + 7 && c >= c0 - 1 && c <= c0 + 7) return 0;
      }
      return -1;
    };
    const cells = [];
    let seed = 4938;
    for (let r = 0; r < N; r++) {
      for (let c = 0; c < N; c++) {
        let on = finder(r, c);
        if (on === -1) {
          seed = (seed * 9301 + 49297) % 233280;
          on = seed / 233280 > 0.52 ? 1 : 0;
        }
        cells.push({ style: on ? 'background: #1B1F24' : 'background: transparent' });
      }
    }
    return { cells: cells };
  }
}
</script>
