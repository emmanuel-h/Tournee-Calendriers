# The quality gates of CLAUDE.md, run by GitHub on every push to main and on
# every pull request (Dependabot's included). Nothing reaches main red.
#
# The instrumented suite (integration_test/app_test.dart) is not run here:
# it needs an Android emulator and is run by Claude on one before each push.
# Neither are the admin flows (integration_test/admin_test.dart), which also
# need the local Firebase emulators (tool/admin_e2e.sh).
name: checks

on:
  push:
    branches: [main]
  pull_request:

# The token only reads the repository: no job writes back to GitHub.
permissions:
  contents: read

# Actions are pinned by commit, not by tag: a tag can be moved to new code,
# a commit cannot. The version in the comment is what Dependabot reads to
# propose updates (it rewrites both).

# A newer push to the same branch cancels the run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Same version as pubspec.yaml's environment: upgrades are one commit each.
  FLUTTER_VERSION: "3.47.6"

jobs:
  analyze:
    name: analyze and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # The Firebase settings are gitignored (the repository is public):
      # written from the secrets FIREBASE_OPTIONS_DART and
      # GOOGLE_SERVICES_JSON, each the base64 of its file. Dependabot's runs
      # read Dependabot secrets, so both are set there too. Accepted: both
      # values ship inside every APK anyway (#153).
      - name: Write Firebase settings
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: bash tool/write_firebase_config.sh
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: dart format --output=none --set-exit-if-changed lib test integration_test

  # Needs no Firebase settings: no test loads bootstrap/firebase.dart, the
  # only file that imports them.
  test:
    name: tests and coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test --coverage
      - run: bash tool/check_coverage.sh
      - name: Upload coverage report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 7

  android:
    # Release-only breakage (R8, resource shrinking, Gradle and plugin
    # versions) never shows in debug builds or unit tests; this job is also
    # what validates Dependabot's Gradle bumps.
    name: android release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          # maplibre_gl compiles with -source 21.
          java-version: "21"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      # The Firebase settings are gitignored (the repository is public):
      # written from the secrets FIREBASE_OPTIONS_DART and
      # GOOGLE_SERVICES_JSON, each the base64 of its file. Dependabot's runs
      # read Dependabot secrets, so both are set there too. Accepted: both
      # values ship inside every APK anyway (#153).
      - name: Write Firebase settings
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: bash tool/write_firebase_config.sh
      - run: flutter pub get
      # Unsigned for upload: CI has no release key (signing arrives in T5.3).
      - run: flutter build appbundle --release

  # The Firestore security rules (firebase/firestore.rules) against the
  # emulator. Node 22, as on the developer machine: firebase-tools 15 and
  # @firebase/rules-unit-testing 5 need Node 20 or later.
  rules:
    name: firestore security rules
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: firebase/package-lock.json
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      # The emulator's jar, downloaded by firebase-tools on first use.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('firebase/package-lock.json') }}
      - run: npm ci
      - run: npm test
