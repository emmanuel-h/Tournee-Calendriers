# Dependabot version updates: once a day, one pull request per outdated
# dependency. Each PR runs the CI checks; nothing is merged automatically.
version: 2
updates:
  # Dart and Flutter packages (pubspec.yaml).
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"

  # Android build (Gradle plugins and wrapper) generated by Flutter.
  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(android)"

  # GitHub Actions used by the CI workflows (added in T0.3).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "Europe/Paris"
    commit-message:
      prefix: "deps(ci)"
